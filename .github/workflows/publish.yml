name: Publish npm package

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu

          REPO_VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_VERSION="$(npm view thecheesiumrunner version 2>/dev/null || true)"

          if [ -z "$PUBLISHED_VERSION" ]; then
            echo "Publishing first version $REPO_VERSION"
          elif [ "$REPO_VERSION" = "$PUBLISHED_VERSION" ]; then
            npm version patch --no-git-tag-version
          elif [ "$(printf '%s\n%s\n' "$REPO_VERSION" "$PUBLISHED_VERSION" | sort -V | tail -n 1)" = "$PUBLISHED_VERSION" ]; then
            npm version "$PUBLISHED_VERSION" --no-git-tag-version --allow-same-version
            npm version patch --no-git-tag-version
          fi

          npm publish --access public
